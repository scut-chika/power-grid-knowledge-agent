version: '3.8'
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file:
      - ../.env
    ports:
      - '8000:8000'
    volumes:
      - ../data:/app/data

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - '80:80'
    depends_on:
      - backend
